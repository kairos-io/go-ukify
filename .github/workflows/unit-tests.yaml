name: Unit tests
on:
  push:
    branches:
      - main
  pull_request:
env:
  FORCE_COLOR: 1
concurrency:
  group: ci-unit-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Run tests
        run: |
          go run github.com/onsi/ginkgo/v2/ginkgo run --covermode=atomic --coverprofile=coverage.out -v --race -r ./...
      - name: Codecov
        # The upload is reporting, and this job is the repo's test gate, so keep
        # it out of the verdict: a Codecov transport error can escape the action
        # as an unhandled exception, which exits the step non-zero whatever
        # fail_ci_if_error says. "Run tests" above still reds the job.
        continue-on-error: true
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.out
