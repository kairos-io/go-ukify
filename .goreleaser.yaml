version: 2
project_name: ukify
builds:
  - id: ukify-amd64
    ldflags:
      - -w -s
      - -X "github.com/itxaka/go-ukify/internal/common.VERSION={{.Tag}}"
      - -X "github.com/itxaka/go-ukify/internal/common.gitCommit={{.ShortCommit}}"
    env:
      - CGO_ENABLED=1
      - CC=gcc
    goos:
      - linux
    goarch:
      - amd64
    binary: '{{ .ProjectName }}'
  - id: ukify-arm64
    ldflags:
      - -w -s
      - -X "github.com/itxaka/go-ukify/internal/common.VERSION={{.Tag}}"
      - -X "github.com/itxaka/go-ukify/internal/common.gitCommit={{.ShortCommit}}"
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
    goos:
      - linux
    goarch:
      - arm64
    binary: '{{ .ProjectName }}'
source:
  enabled: true
  name_template: '{{ .ProjectName }}-{{ .Tag }}-source'
archives:
  # Default template uses underscores instead of -
  - name_template: >-
      {{ .ProjectName }}-{{ .Tag }}-{{- title .Os }}-{{- if eq .Arch "amd64" }}x86_64{{- else if eq .Arch "386" }}i386{{- else }}{{ .Arch }}{{ end }}{{- if .Arm }}v{{ .Arm }}{{ end }}
checksum:
  name_template: '{{ .ProjectName }}-{{ .Tag }}-checksums.txt'
snapshot:
  name_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^Merge pull request'